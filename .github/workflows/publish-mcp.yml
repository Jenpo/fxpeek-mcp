name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [ master ]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          set -e
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$URL" -o mcp.tar.gz && tar xzf mcp.tar.gz mcp-publisher || {
            echo "tarball install failed"; exit 1; }
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
